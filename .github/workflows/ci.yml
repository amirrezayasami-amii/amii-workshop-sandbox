name: CI

# Continuous Integration: lint + run the full test suite (preprocessing, model,
# and API) on every push and pull request.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:        # allow manual runs from the Actions tab

concurrency:
  # Cancel superseded runs on the same ref to save CI minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 & 3.12 have reliable torch wheels; 3.14 does not (see docs).
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only torch wheel first to avoid the multi-GB CUDA
          # download; the generic `torch` in requirements.txt is then satisfied.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite with coverage
        run: pytest -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
